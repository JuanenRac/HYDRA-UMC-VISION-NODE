<title id="t">HYDRA-UMC-VISION-NODE architecture</title>
<desc id="d">HYDRA-UMC-VISION-NODE reads the manifests of its four sibling repositories, describes the perception pipeline against the hardware that is present, validates raw frames, reads DataMatrix codes and serves the same checks over HTTP.</desc>
