#
# Documents how this Vision AI Node integrates its 4 children as real
# containers. All 4 (HYDRA-UMC-VISION-STREAMER, HYDRA-UMC-DETECTION-HEF,
# HYDRA-UMC-SAFETY-ZONES, HYDRA-UMC-VISUAL-SERVOING-API) now ship a real
# Dockerfile of their own, matching the exact CLI/ports their real CM5
# systemd units already run (see each one's own systemd/*.service) - not
# build-tested here (no Docker runtime on this dev machine), but every
# path/flag is the same one already verified live on the real CM5.
# vision-node itself (this repo) now has a real Dockerfile too - the real
# gRPC control API on port 50051 is still future work (v0 is the
# family-readiness HTTP API only, see this repo's own README/main.py).
#
# Layout assumption: the 5 repos are checked out as sibling folders under the
# same GitHub/ parent directory, matching the rest of the HYDRA-UMC ecosystem.
# Run `docker compose config` to validate this on a real Docker host.

version: "3.9"

services:
  vision-node:
    build: .
    image: hydra-umc-vision-node:1.0.0
    container_name: hydra-umc-vision-node
    restart: unless-stopped
    devices:
      - /dev/hailo0:/dev/hailo0        # Hailo-8 M.2 accelerator
    volumes:
      - ./models:/opt/hydra/models:ro  # compiled .hef models (this repo)
    ports:
      - "50051:50051"                  # gRPC control API towards HYDRA-UMC core (not real yet - see this repo's own README)
    mem_limit: 384m                    # matches systemd/hydra-umc-vision-node.service's own MemoryMax
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8094/stats', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - vision-streamer
      - detection-hef
      - safety-zones
      - visual-servoing-api

  # -- children - each a real image now (see each one's own Dockerfile) --

  vision-streamer:
    build: ../HYDRA-UMC-VISION-STREAMER
    image: hydra-umc-vision-streamer:1.0.0
    container_name: hydra-umc-vision-streamer
    devices:
      - /dev/video0:/dev/video0        # repeat per attached USB 3.0 camera
    # Real MJPEG capture+serve (mjpeg_server.py) - GStreamer/full pipeline
    # integration and the Hailo-8 hand-off itself are still future work
    # (see this repo's own README). --device/--port are real, required,
    # per-camera CLI flags (main.py's own `stream serve`), so a real
    # deployment overrides `command:` per camera rather than relying on
    # any default this image ships (there isn't one - see its Dockerfile).
    command: ["stream", "serve", "--device", "0", "--addr", "0.0.0.0", "--port", "8110"]

  detection-hef:
    build: ../HYDRA-UMC-DETECTION-HEF
    image: hydra-umc-detection-hef:1.0.0
    container_name: hydra-umc-detection-hef
    volumes:
      - ../HYDRA-UMC-DETECTION-HEF/build:/opt/hydra/models:ro
      - ../HYDRA-UMC-DETECTION-HEF/registry.json:/etc/hydra-umc-detection-hef/registry.json:ro
    # Serves the curated library of compiled YOLO .hef models that
    # vision-node loads onto the Hailo-8 NPU. Real HTTP API (stdlib
    # http.server) on 8093, matching the real CM5 systemd unit - see
    # this repo's own Dockerfile for why /opt/hydra/models (not the
    # hef-library path this line used before real Dockerfiles existed).

  safety-zones:
    build: ../HYDRA-UMC-SAFETY-ZONES
    image: hydra-umc-safety-zones:1.0.0
    container_name: hydra-umc-safety-zones
    # Real-time 3D intrusion detection - triggers CAN E-STOP through
    # vision-node when a Warning/Danger zone is breached. Real HTTP API
    # (stdlib http.server) on 8108, matching the real CM5 systemd unit.

  visual-servoing-api:
    build: ../HYDRA-UMC-VISUAL-SERVOING-API
    image: hydra-umc-visual-servoing-api:1.0.0
    container_name: hydra-umc-visual-servoing-api
    ports:
      - "50052:50052"                  # gRPC: closed-loop pose-correction feed - still future work, see main.py's own docstring
    # Turns Hailo-8 visual feedback into real-time kinematic pose
    # corrections consumed by the HYDRA-UMC core (STM32H745). Real HTTP
    # API (stdlib http.server) on 8091 today, matching the real CM5
    # systemd unit - the gRPC feed above is the aspirational future path
    # this repo's own README/main.py docstring already name as not built yet.
